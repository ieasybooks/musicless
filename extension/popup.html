<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>nomusic</title>
    <link rel="stylesheet" href="pages.css" />
    <style>
      body { width: 300px; padding: 14px 16px; }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      header img { width: 28px; height: 28px; border-radius: 7px; }
      header h1 { margin: 0; font-size: 15px; flex: 1; }
      .setting { display: flex; gap: 12px; align-items: flex-start; }
      .setting label { flex: 1; font-weight: 600; }
      .setting .hint { margin-top: 3px; }
      hr { border: none; border-top: 1px solid #262b35; margin: 14px 0; }
      footer { display: flex; gap: 14px; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-128.png" alt="" />
      <h1>nomusic</h1>
      <span class="hint" id="version"></span>
    </header>

    <div class="setting">
      <label for="autoStart">
        Remove music automatically
        <div class="hint">Every YouTube video starts without music. When off, click <b>nomusic</b> on a video to start.</div>
      </label>
      <input type="checkbox" id="autoStart" class="switch" />
    </div>

    <hr />
    <p class="hint">
      nomusic keeps voices, speech and singing, and removes the instruments. Some quiet music can
      remain. To hear a video's original audio, click <b>nomusic on</b> on the player.
    </p>
    <p class="hint">Everything runs on this computer. Nothing is uploaded or collected.</p>
    <hr />
    <footer>
      <a href="welcome.html" target="_blank">How it works</a>
      <a href="THIRD_PARTY_NOTICES.txt" target="_blank">Licenses</a>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
