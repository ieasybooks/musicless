<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="extension_name">nomusic</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="popup">
    <!-- One row, as Chrome's settings rows, and Help. Until the user turns
         nomusic on, the disclosure (as on the first-run page) is the row's
         description and turning the switch on is the consent. -->
    <label class="setting">
      <span id="autoStartLabel" data-i18n="popup_autostart_label"></span>
      <input type="checkbox" id="autoStart" class="switch" aria-labelledby="autoStartLabel" aria-describedby="consent done" />
      <span class="hint" id="consent" hidden><span data-i18n="consent_text"></span> <a href="https://github.com/IbraheemTuffaha/nomusic/blob/main/docs/privacy.md" target="_blank" data-i18n="link_privacy"></a></span>
      <span class="hint" id="done" role="status" data-i18n="done_text" hidden></span>
    </label>
    <a class="row" id="help" href="https://github.com/IbraheemTuffaha/nomusic/issues" target="_blank">
      <span data-i18n="link_help"></span>
      <svg class="external" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13.5V18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4.5M14 4h6v6M20 4l-8.5 8.5" /></svg>
    </a>
    <script type="module" src="popup.js"></script>
  </body>
</html>
