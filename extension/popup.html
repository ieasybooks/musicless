<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="extension_name">nomusic</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="popup">
    <!-- One row in both states, as Chrome's settings rows: until the user turns
         nomusic on, "Turn on" holds the switch's place and the disclosure (as
         on the first-run page) is the row's description. -->
    <section id="consent" class="row-head" hidden>
      <h1 data-i18n="popup_autostart_label"></h1>
      <button type="button" class="primary" id="accept" data-i18n="consent_accept"></button>
      <p class="hint"><span data-i18n="consent_text"></span> <a href="https://github.com/IbraheemTuffaha/nomusic/blob/main/docs/privacy.md" target="_blank" data-i18n="link_privacy"></a></p>
    </section>

    <section id="settings" hidden>
      <p class="notice" id="done" role="status" data-i18n="done_text" hidden></p>
      <label class="setting row-head">
        <span id="autoStartLabel" data-i18n="popup_autostart_label"></span>
        <input type="checkbox" id="autoStart" class="switch" aria-labelledby="autoStartLabel" aria-describedby="autoStartHint" />
        <span class="hint" id="autoStartHint" data-i18n="popup_autostart_hint"></span>
      </label>
      <a class="row" id="help" href="https://github.com/IbraheemTuffaha/nomusic/issues" target="_blank">
        <span data-i18n="link_help"></span>
        <svg class="external" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13.5V18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4.5M14 4h6v6M20 4l-8.5 8.5" /></svg>
      </a>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
