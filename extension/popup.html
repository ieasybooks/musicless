<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="extension_name">nomusic</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="popup">
    <!-- Until the user turns nomusic on: the disclosure (as on the first-run page). -->
    <section id="consent" hidden>
      <h1 data-i18n="setup_heading"></h1>
      <p data-i18n="consent_text"></p>
    </section>

    <section id="settings" hidden>
      <p class="notice" id="done" role="status" data-i18n="done_text" hidden></p>
      <div class="setting">
        <label for="autoStart" data-i18n="popup_autostart_label"></label>
        <input type="checkbox" id="autoStart" class="switch" aria-describedby="autoStartHint" />
        <p class="hint" id="autoStartHint" data-i18n="popup_autostart_hint"></p>
      </div>
    </section>

    <footer>
      <a id="privacy" href="https://github.com/IbraheemTuffaha/nomusic/blob/main/docs/privacy.md" target="_blank" data-i18n="link_privacy" hidden></a>
      <a id="help" href="https://github.com/IbraheemTuffaha/nomusic/issues" target="_blank" data-i18n="link_help" hidden></a>
      <button type="button" class="primary" id="accept" data-i18n="consent_accept" hidden></button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
