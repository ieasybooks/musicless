<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="extension_name">nomusic</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="popup">
    <!-- Until the user turns nomusic on: the disclosure and its one action, as
         on the first-run page. -->
    <section id="consent" hidden>
      <h1 data-i18n="setup_heading"></h1>
      <p class="hint"><span data-i18n="consent_text"></span> <a href="https://github.com/IbraheemTuffaha/nomusic/blob/main/docs/privacy.md" target="_blank" data-i18n="link_privacy"></a></p>
      <div class="actions"><button type="button" class="primary" id="accept" data-i18n="consent_accept"></button></div>
    </section>

    <!-- Then the one setting: the row is its switch. -->
    <section id="settings" hidden>
      <label class="setting">
        <span data-i18n="popup_autostart_label"></span>
        <input type="checkbox" id="autoStart" class="switch" />
      </label>
      <p class="hint" id="oneVideo" hidden></p>
      <p class="hint" id="done" role="status" data-i18n="done_text" hidden></p>
    </section>

    <a class="row" id="help" href="https://github.com/IbraheemTuffaha/nomusic#using-nomusic" target="_blank">
      <span data-i18n="link_help"></span>
      <svg class="external" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13.5V18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4.5M14 4h6v6M20 4l-8.5 8.5" /></svg>
    </a>
    <script type="module" src="popup.js"></script>
  </body>
</html>
