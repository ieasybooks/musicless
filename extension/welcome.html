<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="extension_name">Musicless</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="welcome">
    <main>
      <!-- The mark alone: the name follows in the text, and in the heading once turned on. -->
      <svg class="brand" aria-hidden="true" hidden xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#1f1d1a"/><g transform="matrix(0.9222 0 0 0.9222 7.46 3.72)" fill="#f4ede0"><path class="whole-note" d="M18.24 82.37C15.65 75.97 20.61 67.93 29.32 64.41C32.77 63.02 36.29 62.54 39.44 62.88V22H50.44V22.01C54.45 30 69.44 34 72.44 48C74.44 57 71.44 64 66.94 69C65.64 70.4 63.64 69.4 64.24 67.6C66.04 62 66.24 56 62.94 52C59.94 48.5 55.44 46 50.44 44.5V72.91C50.45 73.1 50.45 73.3 50.44 73.49V74.7H50.34C49.6 79.81 45.19 84.96 38.68 87.59C29.98 91.11 20.82 88.77 18.24 82.37Z"/><path class="piece" d="M18.24 82.37C15.65 75.97 20.61 67.93 29.32 64.41C32.77 63.02 36.29 62.54 39.44 62.88V54.96L43.11 51L46.78 57L50.44 52.16V72.91C50.45 73.1 50.45 73.3 50.44 73.49V74.7H50.34C49.6 79.81 45.19 84.96 38.68 87.59C29.98 91.11 20.82 88.77 18.24 82.37Z"/><path class="piece top" d="M52.37 43.18 47.51 46.82 45.64 40.04 41.02 42.84 50.11 11.15 60.68 14.18 60.68 14.19C61.33 17.65 63.78 20.98 66.45 24.62C70.58 30.23 75.25 36.58 74.66 45.24C74.1 54.44 69.29 60.35 63.58 63.91C61.95 64.9 60.3 63.39 61.37 61.82C64.65 56.93 66.49 51.22 64.42 46.47C62.51 42.28 58.87 38.63 54.48 35.81Z"/></g></svg>

      <!-- The two states share one place, so the heading stays where it is when
           the first becomes the second. Until the user chooses, Musicless reads
           no audio: only "Turn on Musicless" starts it. -->
      <div class="states">
        <section id="setup" class="off">
          <h1 data-i18n="setup_heading"></h1>
          <p><span data-i18n="consent_text"></span> <a href="privacy.html" target="_blank" rel="noopener" data-i18n="link_privacy"></a></p>
          <div><button type="button" class="primary" id="accept" data-i18n="consent_accept"></button></div>
        </section>
        <section id="done" class="off">
          <h1 id="doneHeading" tabindex="-1" data-i18n="done_heading"></h1>
          <ol class="steps">
            <li style="--order:0"><strong id="step1Title" data-i18n="done_step1_title"></strong><p id="step1Text" data-i18n="done_step1_text"></p></li>
            <li style="--order:1"><strong data-i18n="done_step2_title"></strong><p data-i18n="done_step2_text"></p></li>
            <li style="--order:2"><strong id="step3Title" data-i18n="done_step3_title"></strong><p id="step3Text" data-i18n="done_step3_text"></p></li>
          </ol>
          <p class="aside" style="--order:3" id="doneText" data-i18n="done_text"></p>
          <div class="done-actions" style="--order:4">
            <a class="button primary" id="open" href="https://www.youtube.com/" data-i18n="done_open"></a>
            <button type="button" class="primary" id="back" data-i18n="done_back" hidden></button>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="welcome.js"></script>
  </body>
</html>
