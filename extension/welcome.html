<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="extension_name">Musicless</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="welcome">
    <main>
      <!-- The mark alone: the name follows in the text, and in the heading once turned on. -->
      <div class="brand" aria-hidden="true"></div>

      <!-- The two states share one place, so the heading stays where it is when
           the first becomes the second. Until the user chooses, Musicless reads
           no audio: only "Turn on" starts it. -->
      <div class="states">
        <section id="setup" class="off">
          <h1 data-i18n="setup_heading"></h1>
          <p><span data-i18n="consent_text"></span> <a href="privacy.html" target="_blank" rel="noopener" data-i18n="link_privacy"></a></p>
          <div><button type="button" class="primary" id="accept" data-i18n="consent_accept"></button></div>
        </section>
        <section id="done" class="off">
          <h1 id="doneHeading" tabindex="-1" data-i18n="done_heading"></h1>
          <p data-i18n="done_wait"></p>
          <p id="doneControl"></p>
          <p class="aside" id="doneText" data-i18n="done_text"></p>
          <div>
            <a class="button primary" id="open" href="https://www.youtube.com/" data-i18n="done_open"></a>
            <button type="button" class="primary" id="back" data-i18n="done_back" hidden></button>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="welcome.js"></script>
  </body>
</html>
