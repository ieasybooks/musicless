<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="extension_name">nomusic</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="welcome">
    <main>
      <p class="brand"><img src="icons/mark.svg" alt="" width="32" height="32" /><span data-i18n="extension_name">nomusic</span></p>

      <!-- The two states share one grid, so nothing moves when the first becomes the second.
           Until the user chooses, nomusic reads no audio: only "Turn on" starts it. -->
      <div class="states">
        <section id="setup" class="off">
          <h1 data-i18n="setup_heading"></h1>
          <p data-i18n="consent_text"></p>
          <div><button type="button" class="primary" id="accept" data-i18n="consent_accept"></button></div>
        </section>
        <section id="done" class="off">
          <h1 id="doneHeading" tabindex="-1" data-i18n="done_heading"></h1>
          <p data-i18n="done_text"></p>
          <div><a class="button primary" href="https://www.youtube.com/" data-i18n="done_open"></a></div>
        </section>
      </div>
    </main>
    <footer>
      <a href="https://github.com/IbraheemTuffaha/nomusic/blob/main/docs/privacy.md" target="_blank" data-i18n="link_privacy"></a>
    </footer>
    <script type="module" src="welcome.js"></script>
  </body>
</html>
