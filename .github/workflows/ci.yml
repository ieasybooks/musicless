name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and browser tests (Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NOMUSIC_TEST_DIR: ${{ github.workspace }}/tests/.work
      # The runner's AppArmor profile blocks Chrome's sandbox.
      NOMUSIC_NO_SANDBOX: '1'
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Build the model and runtime, install the test tools
        run: ./setup.sh --dev
      - name: Unit tests
        working-directory: tests
        run: npm run unit
      - name: Build synthetic test media (nothing copyrighted)
        run: |
          tests/.venv/bin/python tests/build_media.py synthetic "$NOMUSIC_TEST_DIR/media/synth" 240
          tests/.venv/bin/python tests/build_media.py long "$NOMUSIC_TEST_DIR/media/long" 25
      - name: Browser tests on local Media Source pages
        working-directory: tests
        run: MEDIA_SET=synth QUICK=1 node local.mjs
      - name: Package
        run: ./scripts/package.sh
      # Evidence stays in the run log: profiles, recordings and media are not uploaded.
