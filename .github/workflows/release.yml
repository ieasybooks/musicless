name: Release

# A tag runs the workflow file in the commit the tag points at.
# Tag a commit that contains this file. A tag on the old backend
# history does not run this workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The full browser run and the memory check, on the package itself.
  test:
    name: Test the package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MUSICLESS_TEST_DIR: ${{ github.workspace }}/tests/.work
      # The runner's AppArmor profile blocks Chrome's sandbox.
      MUSICLESS_NO_SANDBOX: "1"
      CHROME: /usr/bin/google-chrome
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Build the model and runtime, install the test tools
        run: ./setup.sh --dev

      - name: Unit tests
        working-directory: tests
        run: npm run unit

      - name: Build synthetic test media
        run: |
          tests/.venv/bin/python tests/build_media.py synthetic "$MUSICLESS_TEST_DIR/media/synth" 240
          tests/.venv/bin/python tests/build_media.py long "$MUSICLESS_TEST_DIR/media/long" 25

      - name: Package
        id: package
        run: |
          ./scripts/package.sh
          echo "sha256=$(sha256sum dist/musicless-*.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          unzip -q dist/musicless-*.zip -d "$RUNNER_TEMP/musicless"

      - name: Browser tests of the package on local Media Source pages
        working-directory: tests
        run: MUSICLESS_EXTENSION="$RUNNER_TEMP/musicless" MEDIA_SET=synth node local.mjs

      - name: Memory while separating and after
        working-directory: tests
        run: MUSICLESS_EXTENSION="$RUNNER_TEMP/musicless" MEDIA_SET=synth node memory.mjs

  # Builds the zip again, apart from the test tools, and attests it only if it
  # is the zip the tests ran.
  release:
    name: Package, attest, draft release
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build the model and runtime
        run: ./setup.sh

      - name: Package and SHA-256
        env:
          TESTED: ${{ needs.test.outputs.sha256 }}
        run: |
          ./scripts/package.sh
          cd dist
          sha256sum musicless-*.zip > SHA256SUMS
          cat SHA256SUMS
          test "$(cut -d ' ' -f 1 SHA256SUMS)" = "$TESTED"

      - name: Attest the zip and the checksum file
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/musicless-*.zip
            dist/SHA256SUMS

      - name: Release notes and attestation bundle
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          cp "$BUNDLE" "dist/musicless-${version}.attestation.json"
          VERSION="$version" python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["VERSION"]
          lines = Path("CHANGELOG.md").read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith(f"## [{version}]"))
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")), len(lines))
          body = "\n".join(lines[start:end]).rstrip()
          url = os.environ.get("ATTESTATION_URL") or ""
          verify = "\n".join([
              "",
              "## Verify",
              "",
              "    sha256sum -c SHA256SUMS",
              "    gh attestation verify musicless-*.zip --repo ieasybooks/musicless",
              "",
          ])
          notes = body + "\n" + verify
          if url:
              notes += "\nAttestation: " + url + "\n"
          Path("dist/release-notes.md").write_text(notes)
          PY

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            "dist/musicless-${version}.zip" \
            dist/SHA256SUMS \
            "dist/musicless-${version}.attestation.json"
