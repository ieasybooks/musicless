<!doctype html>
<meta charset="utf-8">
<title>Musicless test player</title>
<style>body { margin: 20px; background: #111; color: #ddd; font: 14px system-ui; } .player { width: 854px; height: 480px; } video { width: 100%; height: 100%; background: #000; }</style>
<div class="player"><video id="video" controls playsinline></video></div>
<pre id="log"></pre>
<script type="module">
// A small Media Source player shaped like YouTube's: separate audio/video
// SourceBuffers fed segment by segment ahead of the playhead, with abort and
// re-append on seek. "bytes" mode appends one fragmented MP4 in fixed-size
// slices that split boxes at arbitrary points. "progressive" plays a plain
// file. window.load(media, variant) swaps the source in the same <video>, like
// a site moving to the next video.
//
// Query parameters: media, variant, slice (bytes per append), ahead (seconds
// of look-ahead), realm=frame (use another frame's MediaSource, which Musicless
// cannot see), worker=1 (Media Source in a dedicated worker, attached through
// srcObject), muted=1 (muted before the source loads), autoplay=1 (the page
// starts playback itself, without a user gesture). A player.json with
// "clearkey" plays ClearKey-encrypted media. window.switchAudio(media) moves
// the audio to another media set's track at the playhead, like a player
// switching to another language.
const video = document.getElementById("video");
const log = (message) => { document.getElementById("log").textContent += message + "\n"; };
const params = new URLSearchParams(location.search);
const AHEAD = Number(params.get("ahead") || 30);
if (params.get("muted") === "1") video.muted = true;
let current = null;

// The window whose MediaSource and URL the player uses.
let realm = window;
if (params.get("realm") === "frame") {
  const frame = document.createElement("iframe");
  frame.style.display = "none";
  document.body.append(frame);
  realm = frame.contentWindow;
}

const idle = (sb) => sb.updating ? new Promise((resolve) => sb.addEventListener("updateend", resolve, { once: true })) : null;
async function append(sb, bytes) {
  await idle(sb);
  sb.appendBuffer(bytes);
  await idle(sb);
}

const b64url = (hex) => btoa(String.fromCharCode(...hex.match(/../g).map((h) => parseInt(h, 16))))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function useClearKey({ kid, key }, mime) {
  const access = await navigator.requestMediaKeySystemAccess("org.w3.clearkey", [{
    initDataTypes: ["keyids", "cenc"], audioCapabilities: [{ contentType: mime }],
  }]);
  const keys = await access.createMediaKeys();
  await video.setMediaKeys(keys);
  const session = keys.createSession();
  session.addEventListener("message", () => {
    const license = { keys: [{ kty: "oct", kid: b64url(kid), k: b64url(key) }], type: "temporary" };
    session.update(new TextEncoder().encode(JSON.stringify(license)));
  });
  await session.generateRequest("keyids", new TextEncoder().encode(JSON.stringify({ kids: [b64url(kid)] })));
}

async function load(media, variant, slice = 200_000, gapMs = 0) {
  current?.stop();
  if (gapMs) {
    video.removeAttribute("src");
    video.srcObject = null;
    video.load();
    await new Promise((resolve) => setTimeout(resolve, gapMs));
  }
  const session = { stopped: false, stop() { this.stopped = true; clearInterval(this.timer); video.removeEventListener("seeking", this.onSeeking); } };
  current = session;
  window.playerReady = false;
  if (variant === "progressive") {
    video.src = `/media/${media}/progressive.mp4`;
    window.playerReady = true;
    return;
  }
  const base = `/media/${media}/${variant}/`;
  const fetchBytes = async (url) => new Uint8Array(await (await fetch(base + url)).arrayBuffer());
  const config = await (await fetch(base + "player.json")).json();
  if (config.clearkey) await useClearKey(config.clearkey, config.mime);

  if (params.get("worker") === "1") {
    // The whole Media Source lives in a worker; the page only sees a handle.
    // Segment lists play their joined audio file here (audio only).
    const audioTrack = config.tracks?.find((track) => track.mime.startsWith("audio/"));
    const url = config.mode === "bytes" ? config.url : `audio.${audioTrack.mime.includes("webm") ? "webm" : "mp4"}`;
    const worker = new Worker("mse-worker.js");
    worker.postMessage({ url: new URL(base + url, location.href).href, mime: config.mime ?? audioTrack.mime, slice });
    const handle = await new Promise((resolve) => worker.addEventListener("message", (event) => event.data.handle && resolve(event.data.handle)));
    video.srcObject = handle;
    window.playerReady = true;
    return;
  }

  const mediaSource = new realm.MediaSource();
  video.src = realm.URL.createObjectURL(mediaSource);
  await new Promise((resolve) => mediaSource.addEventListener("sourceopen", resolve, { once: true }));

  if (config.mode === "bytes") {
    const sb = mediaSource.addSourceBuffer(config.mime);
    const bytes = await fetchBytes(config.url);
    window.playerReady = true;
    for (let at = 0; at < bytes.length && !session.stopped; at += slice) await append(sb, bytes.subarray(at, at + slice));
    if (!session.stopped) mediaSource.endOfStream();
    log(`appended ${bytes.length} bytes in ${Math.ceil(bytes.length / slice)} slices`);
    return;
  }
  mediaSource.duration = config.duration;
  const tracks = config.tracks.map((track) => ({ ...track, sb: mediaSource.addSourceBuffer(track.mime), next: 0, epoch: 0 }));
  for (const track of tracks) await append(track.sb, await fetchBytes(track.init));

  async function pump(track) {
    const epoch = track.epoch;
    while (!session.stopped && !session.starved && track.next < track.segments.length && track.segments[track.next].start < video.currentTime + AHEAD) {
      const bytes = track.base ? new Uint8Array(await (await fetch(track.base + track.segments[track.next].url)).arrayBuffer())
        : await fetchBytes(track.segments[track.next].url);
      if (track.epoch !== epoch || session.stopped) return;
      await append(track.sb, bytes);
      if (track.epoch !== epoch) return;
      track.next++;
    }
    if (!session.stopped && tracks.every((t) => t.next >= t.segments.length) && mediaSource.readyState === "open" &&
        tracks.every((t) => !t.sb.updating)) {
      mediaSource.endOfStream();
    }
  }
  let pumping = false;
  async function pumpAll() {
    if (pumping) return;
    pumping = true;
    try { await Promise.all(tracks.map(pump)); } finally { pumping = false; }
  }
  session.onSeeking = async () => {
    const t = video.currentTime;
    for (const track of tracks) {
      track.epoch++;
      await idle(track.sb);
      if (mediaSource.readyState === "open") track.sb.abort();
      track.next = Math.max(0, track.segments.findLastIndex((segment) => segment.start <= t + 0.001));
    }
    pumping = false;
    pumpAll();
  };
  video.addEventListener("seeking", session.onSeeking);
  // Simulate a network stall: drop what is buffered past the next second and
  // stop loading for `ms`, so the video freezes mid-play without pausing.
  window.stall = async (ms) => {
    const t = video.currentTime;
    session.starved = true;
    for (const track of tracks) {
      track.epoch++;
      await idle(track.sb);
      track.sb.remove(t + 1, mediaSource.duration);
      await idle(track.sb);
      track.next = Math.max(0, track.segments.findLastIndex((segment) => segment.start <= t + 1));
    }
    setTimeout(() => { session.starved = false; pumping = false; pumpAll(); }, ms);
  };
  // Another language: drop the audio buffered from the playhead on and append
  // the other track's from the segment at the playhead.
  window.switchAudio = async (other) => {
    const track = tracks.find((t) => t.mime.startsWith("audio/"));
    const otherBase = `/media/${other}/${variant}/`;
    const replacement = (await (await fetch(otherBase + "player.json")).json()).tracks.find((t) => t.mime === track.mime);
    track.epoch++;
    await idle(track.sb);
    track.sb.abort();
    track.sb.remove(video.currentTime, mediaSource.duration);
    await idle(track.sb);
    track.base = otherBase;
    track.segments = replacement.segments;
    await append(track.sb, new Uint8Array(await (await fetch(otherBase + replacement.init)).arrayBuffer()));
    track.next = Math.max(0, track.segments.findLastIndex((segment) => segment.start <= video.currentTime + 0.001));
    pumping = false;
    pumpAll();
  };
  session.timer = setInterval(pumpAll, 500);
  await pumpAll();
  window.playerReady = true;
}

window.load = load;
load(params.get("media"), params.get("variant"), Number(params.get("slice") || 200_000)).then(() => {
  if (params.get("autoplay") === "1") video.play().catch((error) => log(`autoplay refused: ${error.name}`));
});
</script>
